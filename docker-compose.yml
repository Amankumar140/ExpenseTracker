services:
  # 1. MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: expensetracker-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: expensetracker
    volumes:
      - mongo_data:/data/db

  # 2. Python ML Microservice (PaddleOCR + Mistral LLM)
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: expensetracker-ml-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - GROQ_MODEL=${GROQ_MODEL:-qwen/qwen3.8-27b}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}

  # 3. Express Node.js Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expensetracker-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/expensetracker
      - JWT_SECRET=${JWT_SECRET:-supersecretjwtkey12345}
      - ML_SERVICE_URL=http://ml-service:8000
      - FRONTEND_URL=${FRONTEND_URL:-https://expense-tracker-eight-flax-34.vercel.app}
    depends_on:
      - mongo
      - ml-service

volumes:
  mongo_data:
